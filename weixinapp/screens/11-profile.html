<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>我的 · 两个人的小世界</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../shared/css/app.css" />
</head>
<body>
  <div class="phone">
    <header class="wx-nav" data-od-id="profile-nav">
      <button class="nav-back" id="btn-back" aria-label="返回"><svg class="ic"><use href="#ic-back"></use></svg></button>
      <span class="nav-title">我的 · 情侣设置</span>
      <div class="wx-capsule" aria-hidden="true">
        <span class="caps-item"><svg class="ic-dots"><use href="#ic-dots"></use></svg></span>
        <span class="caps-divider"></span>
        <span class="caps-item"><svg class="ic-ring"><use href="#ic-ring"></use></svg></span>
      </div>
    </header>

    <main class="page stack" data-od-id="profile-page">
      <!-- 我的资料 -->
      <section class="card card-peach" data-od-id="profile-me">
        <div class="row-between">
          <div class="row" style="gap:12px">
            <span id="me-avatar"></span>
            <div>
              <p style="font-size:16px;font-weight:700" id="me-name">--</p>
              <p style="font-size:12.5px;color:var(--muted)" id="me-city">--</p>
            </div>
          </div>
          <button class="btn btn-ghost btn-sm" id="btn-edit-nick">编辑昵称</button>
        </div>
      </section>

      <!-- 情侣资料 -->
      <section class="card card-pink" data-od-id="profile-couple">
        <p class="card-title">我们的资料 <span class="heart-txt">❤️</span></p>
        <div class="row" style="justify-content:center;gap:14px;margin-top:14px">
          <div style="text-align:center">
            <span id="cp-me"></span>
            <p style="font-size:13px;font-weight:600;margin-top:6px" id="cp-me-name">--</p>
          </div>
          <svg class="ic" style="width:20px;height:20px;color:var(--pink-ink)"><use href="#ic-heart-fill"></use></svg>
          <div style="text-align:center">
            <span id="cp-ta"></span>
            <p style="font-size:13px;font-weight:600;margin-top:6px" id="cp-ta-name">--</p>
          </div>
        </div>
        <div class="card-foot" style="text-align:center">
          恋爱开始 <span class="num" id="cp-start">--</span>　·　已经在一起 <span class="num" id="cp-days">--</span> 天
        </div>
      </section>

      <!-- 位置共享 -->
      <section class="card" data-od-id="profile-location">
        <p class="card-title">位置共享</p>
        <div class="setting-row">
          <span class="s-ic"><svg class="ic"><use href="#ic-pin"></use></svg></span>
          <div class="s-main"><p class="s-title">允许 TA 查看我的城市</p><p class="s-sub">只显示城市，不显示精确位置</p></div>
          <span class="switch"><input type="checkbox" id="sw-city" aria-label="允许 TA 查看我的城市" /><span class="track"></span></span>
        </div>
        <div class="setting-row">
          <span class="s-ic"><svg class="ic"><use href="#ic-heart"></use></svg></span>
          <div class="s-main"><p class="s-title">允许 TA 查看两人距离</p><p class="s-sub">首页显示我们相距多远</p></div>
          <span class="switch"><input type="checkbox" id="sw-dist" aria-label="允许 TA 查看两人距离" /><span class="track"></span></span>
        </div>
      </section>

      <!-- 通知设置 -->
      <section class="card" data-od-id="profile-notify">
        <p class="card-title">通知设置</p>
        <div class="setting-row">
          <span class="s-ic"><svg class="ic"><use href="#ic-bell"></use></svg></span>
          <div class="s-main"><p class="s-title">提醒吃饭</p><p class="s-sub">TA 提醒我吃饭时通知我</p></div>
          <span class="switch"><input type="checkbox" id="sw-meal" aria-label="提醒吃饭通知" /><span class="track"></span></span>
        </div>
        <div class="setting-row">
          <span class="s-ic"><svg class="ic"><use href="#ic-calendar"></use></svg></span>
          <div class="s-main"><p class="s-title">约会提醒</p><p class="s-sub">约会前一天提醒我们</p></div>
          <span class="switch"><input type="checkbox" id="sw-date" aria-label="约会提醒" /><span class="track"></span></span>
        </div>
        <div class="setting-row">
          <span class="s-ic"><svg class="ic"><use href="#ic-moon"></use></svg></span>
          <div class="s-main"><p class="s-title">叫醒服务</p><p class="s-sub">07:30 的温柔叫醒</p></div>
          <span class="switch"><input type="checkbox" id="sw-wake" aria-label="叫醒服务" /><span class="track"></span></span>
        </div>
      </section>

      <!-- 数据区 -->
      <section class="card" data-od-id="profile-data">
        <p class="card-title" style="margin-bottom:8px">数据与隐私</p>
        <button class="btn btn-ghost btn-block" id="btn-reset" style="justify-content:flex-start;border-radius:12px">
          <svg class="ic" style="color:var(--muted)"><use href="#ic-edit"></use></svg>清空演示数据，恢复初始状态
        </button>
        <button class="btn btn-danger btn-block" id="btn-unpair" style="justify-content:flex-start;border-radius:12px">
          <svg class="ic"><use href="#ic-trash"></use></svg>解除情侣关系
        </button>
        <p class="card-foot">所有内容默认只对我们两个人可见，数据只保存在本机演示环境。</p>
      </section>
    </main>
  </div>

  <script src="../shared/js/store.js"></script>
  <script src="../shared/js/app.js"></script>
  <script>
    (function () {
      var $ = function (id) { return document.getElementById(id); };

      function render() {
        var st = Store.get();
        $('me-avatar').innerHTML = Avatar(st.me.id, 48);
        $('me-name').textContent = st.me.nickname;
        $('me-city').textContent = st.me.city + ' · 电量 ' + st.me.battery + '%（' + st.me.batteryAt + ' 更新）';
        $('cp-me').innerHTML = Avatar(st.me.id, 56);
        $('cp-ta').innerHTML = Avatar(st.ta.id, 56);
        $('cp-me-name').textContent = st.me.nickname;
        $('cp-ta-name').textContent = st.ta.nickname;
        $('cp-start').textContent = Store.fmtDate(st.couple.start);
        $('cp-days').textContent = Store.daysTogether(st.couple.start);

        $('sw-city').checked = !!st.settings.shareCity;
        $('sw-dist').checked = !!st.settings.shareDistance;
        $('sw-meal').checked = !!st.settings.mealNotify;
        $('sw-date').checked = !!st.settings.dateNotify;
        $('sw-wake').checked = !!st.settings.wake;
      }
      render();

      function bindSwitch(id, key, okMsg) {
        $(id).addEventListener('change', function () {
          Store.commit(function (s) { s.settings[key] = this.checked; }.bind(this));
          UI.toast(okMsg, '✅');
        });
      }
      bindSwitch('sw-city', 'shareCity', '位置共享已更新');
      bindSwitch('sw-dist', 'shareDistance', '距离显示已更新');
      bindSwitch('sw-meal', 'mealNotify', '通知设置已更新');
      bindSwitch('sw-date', 'dateNotify', '约会提醒已更新');
      bindSwitch('sw-wake', 'wake', '叫醒服务已更新');

      /* 编辑昵称 */
      $('btn-edit-nick').addEventListener('click', function () {
        var sheet = UI.openSheet(
          '<div class="sheet-handle"></div>' +
          '<p class="sheet-title">编辑昵称</p>' +
          '<div class="field" style="margin-top:12px"><label for="ed-nick">我的昵称</label>' +
          '<input class="input" id="ed-nick" type="text" maxlength="8" value="' + esc(Store.get().me.nickname) + '" /></div>' +
          '<button class="btn btn-primary btn-block" id="ed-save" style="margin-top:12px">保存</button>'
        );
        sheet.el.querySelector('#ed-save').addEventListener('click', function (btn) {
          var v = sheet.el.querySelector('#ed-nick').value.trim();
          if (!v) { UI.toast('昵称不能是空的哦～', '🌷'); return; }
          UI.withSun(btn, 600, '正在保存', function () {
            Store.commit(function (s) { s.me.nickname = v; });
            sheet.close();
            UI.toast('昵称改好啦 ❤️', '✏️');
            render();
          });
        });
      });

      /* 清空演示数据 */
      $('btn-reset').addEventListener('click', function () {
        UI.confirm({
          ill: Icon('ic-edit'),
          title: '清空演示数据？',
          sub: '心情、约饭、日常、计划都会恢复成初始演示状态',
          ok: '清空'
        }).then(function (ok) {
          if (!ok) return;
          Store.reset();
          UI.toast('已恢复初始状态', '🍃');
          render();
        });
      });

      /* 解除情侣关系（演示） */
      $('btn-unpair').addEventListener('click', function () {
        UI.confirm({
          ill: Icon('ic-trash'),
          title: '解除情侣关系？',
          sub: '这是演示环境，解除后所有数据会恢复初始状态',
          ok: '解除',
          danger: true
        }).then(function (ok) {
          if (!ok) return;
          Store.reset();
          UI.toast('演示模式：关系已解除并重置', '💔');
          setTimeout(function () { location.href = '01-home.html'; }, 1100);
        });
      });

      $('btn-back').addEventListener('click', function () { UI.back('01-home.html'); });
      UI.onUpdate(render);
    })();
  </script>
</body>
</html>
