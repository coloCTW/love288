<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>添加约饭 · 两个人的小世界</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../shared/css/app.css" />
</head>
<body>
  <div class="phone">
    <header class="wx-nav" data-od-id="add-meal-nav">
      <button class="nav-back" id="btn-back" aria-label="返回"><svg class="ic"><use href="#ic-back"></use></svg></button>
      <span class="nav-title">添加约饭</span>
      <div class="wx-capsule" aria-hidden="true">
        <span class="caps-item"><svg class="ic-dots"><use href="#ic-dots"></use></svg></span>
        <span class="caps-divider"></span>
        <span class="caps-item"><svg class="ic-ring"><use href="#ic-ring"></use></svg></span>
      </div>
    </header>

    <main class="page" data-od-id="add-meal-page">
      <div class="page-head">
        <p class="hand">一起去吃好吃的吧～</p>
        <p class="head-sub">创建后会同步出现在「计划」里哦</p>
      </div>

      <section class="card" data-od-id="add-meal-form">
        <form class="form-stack" id="meal-form" novalidate>
          <div class="field" id="fld-kind">
            <label for="f-kind">吃什么</label>
            <input class="input" id="f-kind" type="text" placeholder="比如：火锅、日料、烧烤…" />
          </div>
          <div class="field-row">
            <div class="field" id="fld-date">
              <label for="f-date">日期<span class="req">*</span></label>
              <input class="input" id="f-date" type="date" />
              <span class="f-err">还没有选日期哦，约在哪天呀？</span>
            </div>
            <div class="field" id="fld-time">
              <label for="f-time">时间<span class="req">*</span></label>
              <input class="input" id="f-time" type="time" value="12:30" />
              <span class="f-err">还没有选时间哦～</span>
            </div>
          </div>
          <div class="field" id="fld-loc">
            <label for="f-loc">地点<span class="req">*</span></label>
            <input class="input" id="f-loc" type="text" placeholder="餐厅名字，比如：海底捞（陆家嘴店）" />
            <span class="f-err">地点还没有填，TA 会找不到路啦～</span>
          </div>
          <div class="field" id="fld-city">
            <label for="f-city">城市</label>
            <select class="input" id="f-city">
              <option value="上海市">上海市</option>
              <option value="北京市">北京市</option>
              <option value="青岛市">青岛市</option>
              <option value="杭州市">杭州市</option>
              <option value="成都市">成都市</option>
            </select>
          </div>
          <div class="field">
            <label for="f-note">想对 TA 说</label>
            <input class="input" id="f-note" type="text" placeholder="比如：和你一起吃饭，真好～" />
          </div>
          <div class="field">
            <label>图片（选填）</label>
            <div class="photo-strip" style="grid-template-columns:repeat(3,1fr)">
              <button type="button" class="photo-slot" id="meal-photo" aria-label="添加图片">
                <span class="slot-inner"><svg class="ic"><use href="#ic-photo"></use></svg><span>添加图片</span></span>
              </button>
            </div>
          </div>
          <button class="btn btn-primary btn-block" type="submit" id="btn-create" style="min-height:50px;font-size:15.5px;margin-top:4px">
            <svg class="ic"><use href="#ic-heart-fill"></use></svg>创建约饭
          </button>
        </form>
      </section>
    </main>
  </div>

  <script src="../shared/js/store.js"></script>
  <script src="../shared/js/app.js"></script>
  <script>
    (function () {
      var $ = function (id) { return document.getElementById(id); };

      /* 默认日期 = 后天 */
      $('f-date').value = Store.addDays(2);

      /* 图片插槽：点击切换占位状态（原型中以插画占位，发布时从相册选择） */
      var photoOn = false;
      $('meal-photo').addEventListener('click', function () {
        photoOn = !photoOn;
        if (photoOn) {
          this.classList.add('filled');
          this.innerHTML = '<span class="h-photo" style="position:absolute;inset:0;display:grid;place-items:center;background:var(--paper-green);color:var(--green-ink)">' + Icon('ic-bowl') + '</span>' +
            '<button type="button" class="rm-photo" aria-label="移除图片">' + Icon('ic-check') + '</button>';
          this.querySelector('.rm-photo').addEventListener('click', function (e) { e.stopPropagation(); photoOn = false; });
          UI.toast('原型演示：发布时会打开相册选择哦', '📷');
        } else {
          this.classList.remove('filled');
          this.innerHTML = '<span class="slot-inner">' + Icon('ic-photo') + '<span>添加图片</span></span>';
        }
      });

      /* 提交：必填校验（日期/时间/地点，PRD §9.4） */
      function markInvalid(fieldId, on) {
        var fld = $(fieldId);
        fld.classList.toggle('invalid', on);
        var input = fld.querySelector('.input');
        if (input) input.classList.toggle('invalid', on);
      }
      $('meal-form').addEventListener('submit', function (e) {
        e.preventDefault();
        var date = $('f-date').value, time = $('f-time').value, loc = $('f-loc').value.trim();
        var bad = false;
        markInvalid('fld-date', !date);
        markInvalid('fld-time', !time);
        markInvalid('fld-loc', !loc);
        if (!date || !time || !loc) {
          UI.toast('还有必填项没有填哦，检查一下～', '🌷');
          return;
        }
        var kind = $('f-kind').value.trim() || '约会吃饭';
        var city = $('f-city').value;
        var note = $('f-note').value.trim();
        UI.withSun($('btn-create'), 800, '正在约定', function () {
          Store.commit(function (s) {
            var id = Store.uid('meal');
            s.meals.push({
              id: id, creatorId: s.me.id, kind: kind,
              date: date, time: time, city: city, location: loc, note: note
            });
            /* 约饭同时写入「计划」月历（PRD §18 数据联动） */
            s.events.push({
              id: 'ev-' + id, creatorId: s.me.id, title: kind,
              type: 'meal', date: date, time: time,
              city: city, location: loc, note: note
            });
          });
          UI.flyHearts($('btn-create'), 8);
          UI.toast('好啦，约定完成 ❤️', '🥢');
          setTimeout(function () { location.href = '03-eat.html'; }, 1200);
        });
      });

      $('btn-back').addEventListener('click', function () { UI.back('03-eat.html'); });
    })();
  </script>
</body>
</html>
